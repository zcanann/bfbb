name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The private image contains the original executable. Only run trusted code.
    if: >-
      github.repository == 'zcanann/bfbb' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/zcanann/bfbb-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -a /orig .
          python tools/patch_compiler.py /compilers
          python tools/patch_compiler_rw.py /compilers --p1g

      - name: Build and verify executable
        run: |
          python configure.py --map --version GQPE78 --binutils /binutils --compilers /compilers
          ninja all_source build/GQPE78/progress.json build/GQPE78/report.json

      - name: Generate progress page
        run: python tools/ci_progress.py build/GQPE78 --output build/progress-site

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: GQPE78_report
          if-no-files-found: error
          path: build/GQPE78/report.json

      - name: Upload progress metadata
        uses: actions/upload-artifact@v4
        with:
          name: GQPE78_metadata
          if-no-files-found: error
          path: |
            build/GQPE78/progress.json
            build/GQPE78/progress-commit.json

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: GQPE78_maps
          if-no-files-found: error
          path: build/GQPE78/**/*.MAP

      - name: Upload progress site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/progress-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy progress page
        id: deployment
        uses: actions/deploy-pages@v4
