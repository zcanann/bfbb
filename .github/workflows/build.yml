name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [GQPE78, GQPP78, GU4Y78]
    # The private image contains the original executables. Only run trusted code.
    if: >-
      github.repository == 'zcanann/bfbb' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/zcanann/bfbb-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cp -a /orig .
          python tools/patch_compiler.py /compilers
          python tools/patch_compiler_rw.py /compilers --p1g

      - name: Build and verify executable
        run: |
          python configure.py --map --version ${{ matrix.version }} --binutils /binutils --compilers /compilers
          ninja all_source build/${{ matrix.version }}/progress.json build/${{ matrix.version }}/report.json

      - name: Generate progress page
        run: python tools/ci_progress.py build/${{ matrix.version }} --version ${{ matrix.version }} --version-page --output build/progress-site

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          if-no-files-found: error
          path: build/${{ matrix.version }}/report.json

      - name: Upload progress metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_metadata
          if-no-files-found: error
          path: |
            build/${{ matrix.version }}/progress.json
            build/${{ matrix.version }}/progress-commit.json

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_maps
          if-no-files-found: error
          path: build/${{ matrix.version }}/**/*.MAP

      - name: Upload progress site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_site
          if-no-files-found: error
          path: build/progress-site

  platform-baseline:
    name: Verify ${{ matrix.version }} baseline
    strategy:
      fail-fast: false
      matrix:
        version: [SLUS-20680, SLES-51968, SLES-51970, SLES-53623, XBOX-US, XBOX-EU]
    if: >-
      github.repository == 'zcanann/bfbb' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ startsWith(matrix.version, 'XBOX-') && 'ghcr.io/zcanann/bfbb-build:xbox' || 'ghcr.io/zcanann/bfbb-build:main' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare verified originals and objdiff
        run: |
          cp -a /orig .
          mkdir -p build/tools
          python tools/download_tool.py objdiff-cli build/tools/objdiff-cli --tag v3.7.1

      - name: Verify original and compare PS2 source units
        if: startsWith(matrix.version, 'SL')
        run: python tools/platform_progress.py report --version ${{ matrix.version }} --ps2-compilers /ps2-compilers --wibo /usr/local/bin/wibo-ps2

      - name: Verify original and compare Xbox source functions
        if: startsWith(matrix.version, 'XBOX-')
        run: python tools/platform_progress.py report --version ${{ matrix.version }} --xbox-compilers /xbox-compilers --wine /usr/lib/wine/wine

      - name: Verify PS2 runtime call evidence
        if: startsWith(matrix.version, 'SL') && matrix.version != 'SLES-53623'
        run: python tools/verify_ps2_runtime.py

      - name: Verify France recovery candidates
        if: matrix.version == 'SLES-53623'
        run: |
          python tools/platforms/verify_reviewed.py
          python tools/platforms/france_candidates.py --check
          cp config/platforms/SLES-53623/symbol-candidates.json build/SLES-53623/symbol-candidates.json

      - name: Verify reviewed Xbox function evidence
        if: startsWith(matrix.version, 'XBOX-')
        run: python tools/platforms/verify_xbox_reviewed.py

      # Function-only baselines remain diagnostics. Standard reports use verified
      # complete code-region denominators and unchanged compiled-function scores.
      - name: Upload platform status and coverage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_baseline
          if-no-files-found: error
          path: |
            build/${{ matrix.version }}/progress.json
            build/${{ matrix.version }}/coverage.json
            build/${{ matrix.version }}/relocations.json
            build/${{ matrix.version }}/symbols.json
            build/${{ matrix.version }}/address-anchors.json
            build/${{ matrix.version }}/data-extents.json
            build/${{ matrix.version }}/splits.json
            build/${{ matrix.version }}/symbol-candidates.json
            build/${{ matrix.version }}/verified-anonymous-functions.json
            build/${{ matrix.version }}/corroborated-functions.json
            build/${{ matrix.version }}/relocation-corroborated-functions.json
            build/${{ matrix.version }}/region-layout.json
            build/${{ matrix.version }}/section-coverage.json

      - name: Upload partial-function objdiff comparison
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_functions
          if-no-files-found: error
          path: build/${{ matrix.version }}/baseline-report.json

      - name: Verify standard report schema
        run: build/tools/objdiff-cli report changes -o build/${{ matrix.version }}/schema-check.json build/${{ matrix.version }}/report.json build/${{ matrix.version }}/report.json

      - name: Upload platform progress report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          if-no-files-found: error
          path: build/${{ matrix.version }}/report.json

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download public progress pages
        uses: actions/download-artifact@v4
        with:
          pattern: '*_site'
          path: build/progress-pages

      - name: Assemble version pages and USA defaults
        run: |
          mkdir -p build/progress-site
          for version in GQPE78 GQPP78 GU4Y78; do
            cp -a "build/progress-pages/${version}_site" "build/progress-site/$version"
          done
          python tools/ci_progress.py build/progress-site/GQPE78 --version GQPE78 --output build/progress-site

      - name: Upload combined progress site
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/progress-site

      - name: Deploy progress page
        id: deployment
        uses: actions/deploy-pages@v4
